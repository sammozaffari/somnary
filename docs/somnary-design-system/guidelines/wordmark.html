<!-- @dsCard group="Brand" viewport="700x260" subtitle="The mark is the letterform — S in Onest 600, ink on paper. 16 / 32 / 180px, both themes" name="Mark & favicon" -->
<!DOCTYPE html>
<html><head><link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;font-family:var(--font-sans);display:grid;grid-template-columns:1fr 1fr}
.t{background:var(--surface-page);color:var(--text-body);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px}
.row{display:flex;align-items:flex-end;gap:22px}
.mark{background:var(--surface-page);border:var(--border-w) solid var(--border-hairline);color:var(--ink);font-weight:600;display:flex;align-items:center;justify-content:center;line-height:1}
.cap{font-size:12px;color:var(--text-faint);text-align:center;margin-top:6px;font-variant-numeric:tabular-nums}
.wm{font-size:34px;font-weight:600;letter-spacing:var(--tracking-display)}
</style>
</head><body>
<div class="t">
  <div class="wm">Somnary</div>
  <div class="row">
    <div><div class="mark" style="width:16px;height:16px;border-radius:3.5px;font-size:10.5px">S</div><div class="cap">16</div></div>
    <div><div class="mark" style="width:32px;height:32px;border-radius:7px;font-size:21px">S</div><div class="cap">32</div></div>
    <div><div class="mark" style="width:120px;height:120px;border-radius:26px;font-size:79px">S</div><div class="cap">180 (touch, shown at 120)</div></div>
  </div>
</div>
<div class="t" data-theme="dusk">
  <div class="wm">Somnary</div>
  <div class="row">
    <div><div class="mark" style="width:16px;height:16px;border-radius:3.5px;font-size:10.5px">S</div><div class="cap">16</div></div>
    <div><div class="mark" style="width:32px;height:32px;border-radius:7px;font-size:21px">S</div><div class="cap">32</div></div>
    <div><div class="mark" style="width:120px;height:120px;border-radius:26px;font-size:79px">S</div><div class="cap">180 (touch, shown at 120)</div></div>
  </div>
</div>
</body></html>
