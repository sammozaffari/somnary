<!DOCTYPE html>
<html><head><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--surface-page);color:var(--text-body);font-family:var(--font-sans);padding:24px 28px;display:flex;flex-direction:column;gap:8px}</style>
</head><body>
<div style="font-size:var(--text-sm);font-weight:var(--weight-strong);color:var(--text-faint);">Remedy</div>
<div style="display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;">
  <span style="font-size:var(--display-lg);font-weight:var(--weight-title);letter-spacing:var(--tracking-display);line-height:1.05;">Melatonin</span>
  <span style="display:inline-flex;align-items:center;gap:8px;background:var(--bucket-works-tint);color:var(--bucket-works);border-radius:var(--radius-pill);padding:8px 12px;font-size:var(--text-sm);font-weight:var(--weight-strong);line-height:1;">
    <svg width="14" height="14" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.5" fill="currentColor"/></svg>Helps most people sleep
  </span>
</div>
<div style="font-size:var(--text-base);font-weight:var(--weight-body);line-height:var(--leading-body);color:var(--text-muted);max-width:52ch;">Solid studies show most adults fall asleep a little sooner. The effect is real, but modest.</div>
<div style="font-size:var(--text-lg);font-weight:var(--weight-ui);line-height:var(--leading-snug);font-variant-numeric:tabular-nums;">Falls asleep about 7 minutes sooner, on average.</div>
<div style="display:flex;gap:16px;font-size:var(--text-xs);font-weight:var(--weight-meta);font-variant-numeric:tabular-nums;color:var(--text-faint);">
  <span>14 sources</span><span>·</span><span>Last checked 1 August 2026</span>
</div>
</body></html>
