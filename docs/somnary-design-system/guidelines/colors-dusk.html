<!-- @dsCard group="Colors" viewport="700x200" subtitle="Dusk — designed low-light theme: amber-shifted text, lowered contrast, dimmed chrome" name="Dusk palette" -->
<!DOCTYPE html>
<html data-theme="dusk"><head><link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;background:var(--surface-page);font-family:var(--font-sans);padding:20px 24px;display:flex;gap:10px}
.sw{flex:1;border-radius:var(--radius-sm);border:1px solid var(--border-hairline);padding:10px 10px 8px;display:flex;flex-direction:column;justify-content:flex-end;height:130px}
.n{font-size:11.5px;font-weight:600}.v{font-size:11px;font-variant-numeric:tabular-nums;font-weight:450;opacity:.75}
</style>
</head><body>
<div class="sw" style="background:var(--paper)"><div class="n" style="color:var(--ink)">Night paper</div><div class="v" style="color:var(--ink)">#17151E</div></div>
<div class="sw" style="background:var(--paper-raised)"><div class="n" style="color:var(--ink)">Raised</div><div class="v" style="color:var(--ink)">#201D29</div></div>
<div class="sw" style="background:var(--paper); border-color:var(--line-strong)"><div class="n" style="color:var(--ink)">Text · amber-shifted</div><div class="v" style="color:var(--ink)">#E7DECB</div></div>
<div class="sw" style="background:var(--evidence-tint)"><div class="n" style="color:var(--evidence)">Evidence tint</div><div class="v" style="color:var(--evidence)">#232B3F</div></div>
<div class="sw" style="background:var(--paper)"><div class="n" style="color:var(--evidence)">Evidence · lifted</div><div class="v" style="color:var(--evidence)">#8FA5CE</div></div>
<div class="sw" style="background:var(--paper)"><div class="n" style="color:var(--sage)">Sage</div><div class="v" style="color:var(--sage)">#92A385</div></div>
</body></html>
