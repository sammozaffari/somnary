<!-- @dsCard group="Colors" viewport="700x200" subtitle="Day — warm paper, ink interface, evidence blue reserved for data" name="Day palette" -->
<!DOCTYPE html>
<html><head><link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;background:var(--surface-page);font-family:var(--font-sans);padding:20px 24px;display:flex;gap:10px}
.sw{flex:1;border-radius:var(--radius-sm);border:1px solid var(--border-hairline);padding:10px 10px 8px;display:flex;flex-direction:column;justify-content:flex-end;height:130px}
.n{font-size:11.5px;font-weight:600}.v{font-size:11px;font-variant-numeric:tabular-nums;font-weight:450;opacity:.75}
</style>
</head><body>
<div class="sw" style="background:var(--paper)"><div class="n" style="color:var(--ink)">Paper</div><div class="v" style="color:var(--ink)">#F6F2E9</div></div>
<div class="sw" style="background:var(--paper-raised)"><div class="n" style="color:var(--ink)">Raised</div><div class="v" style="color:var(--ink)">#FBF8F1</div></div>
<div class="sw" style="background:var(--ink)"><div class="n" style="color:#F6F2E9">Ink</div><div class="v" style="color:#F6F2E9">#1C1B22</div></div>
<div class="sw" style="background:var(--evidence)"><div class="n" style="color:#fff">Evidence · ink blue — data only</div><div class="v" style="color:#fff">#2C3E63</div></div>
<div class="sw" style="background:var(--evidence-tint)"><div class="n" style="color:var(--evidence-strong)">Evidence tint</div><div class="v" style="color:var(--evidence-strong)">#E2E6EF</div></div>
<div class="sw" style="background:var(--sage)"><div class="n" style="color:#fff">Sage</div><div class="v" style="color:#fff">#6E7D64</div></div>
</body></html>
