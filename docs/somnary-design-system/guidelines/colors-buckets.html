<!-- @dsCard group="Colors" viewport="700x230" subtitle="Four buckets — colourblind-safe, shape-coded, AA on paper, both themes" name="Bucket colours" -->
<!DOCTYPE html>
<html><head><link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;font-family:var(--font-sans);display:grid;grid-template-rows:1fr 1fr}
.theme{display:flex;gap:8px;align-items:center;padding:16px 24px;background:var(--surface-page)}
.chip{flex:1;display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:var(--radius-pill);font-size:12.5px;font-weight:600}
svg{flex:none}
</style>
</head><body>
<div class="theme">
  <div class="chip" style="background:var(--bucket-works-tint);color:var(--bucket-works)"><svg width="14" height="14" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.5" fill="currentColor"/></svg>Helps most people sleep</div>
  <div class="chip" style="background:var(--bucket-maybe-tint);color:var(--bucket-maybe)"><svg width="14" height="14" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M2 8 a6 6 0 0 0 12 0 z" fill="currentColor"/></svg>May help sleep a little</div>
  <div class="chip" style="background:var(--bucket-unknown-tint);color:var(--bucket-unknown)"><svg width="14" height="14" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>Not properly tested for sleep</div>
  <div class="chip" style="background:var(--bucket-avoid-tint);color:var(--bucket-avoid)"><svg width="14" height="14" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="1.6"/><line x1="3.8" y1="12.2" x2="12.2" y2="3.8" stroke="currentColor" stroke-width="1.6"/></svg>Tested — doesn't seem to help sleep</div>
</div>
<div class="theme" data-theme="dusk">
  <div class="chip" style="background:var(--bucket-works-tint);color:var(--bucket-works)"><svg width="14" height="14" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.5" fill="currentColor"/></svg>Helps most people sleep</div>
  <div class="chip" style="background:var(--bucket-maybe-tint);color:var(--bucket-maybe)"><svg width="14" height="14" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M2 8 a6 6 0 0 0 12 0 z" fill="currentColor"/></svg>May help sleep a little</div>
  <div class="chip" style="background:var(--bucket-unknown-tint);color:var(--bucket-unknown)"><svg width="14" height="14" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>Not properly tested for sleep</div>
  <div class="chip" style="background:var(--bucket-avoid-tint);color:var(--bucket-avoid)"><svg width="14" height="14" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="1.6"/><line x1="3.8" y1="12.2" x2="12.2" y2="3.8" stroke="currentColor" stroke-width="1.6"/></svg>Tested — doesn't seem to help sleep</div>
</div>
</body></html>
