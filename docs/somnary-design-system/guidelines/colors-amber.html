<!DOCTYPE html>
<html><head><link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;font-family:var(--font-sans);display:grid;grid-template-rows:1fr 1fr}
.t{background:var(--surface-page);padding:14px 24px;display:flex;align-items:center}
.callout{width:100%;background:var(--amber-tint);border:1px solid var(--amber-line);border-radius:var(--radius-md);padding:12px 16px;font-size:14px;line-height:1.5;color:var(--text-body)}
.callout b{color:var(--amber);font-weight:600}
</style>
</head><body>
<div class="t"><div class="callout"><b>Check with your pharmacist first.</b> Valerian can add to the effect of sleeping pills and some antidepressants.</div></div>
<div class="t" data-theme="dusk"><div class="callout"><b>Check with your pharmacist first.</b> Valerian can add to the effect of sleeping pills and some antidepressants.</div></div>
</body></html>
