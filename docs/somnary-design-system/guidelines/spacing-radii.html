<!-- @dsCard group="Foundations" viewport="700x180" subtitle="Spacing scale, radii, hit targets" name="Spacing & radii" -->
<!DOCTYPE html>
<html><head><link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;background:var(--surface-page);font-family:var(--font-sans);color:var(--text-body);padding:20px 24px;display:flex;flex-direction:column;gap:16px}
.bars{display:flex;align-items:flex-end;gap:10px}
.b{background:var(--surface-sunken);border:1px solid var(--border-strong);border-radius:3px;width:34px}
.l{font-size:10px;font-variant-numeric:tabular-nums;color:var(--text-muted);text-align:center;margin-top:4px}
.r{display:flex;gap:12px;align-items:center}
.rr{background:var(--surface-card);border:1px solid var(--border-hairline);width:72px;height:44px;display:flex;align-items:center;justify-content:center;font-size:10px;font-variant-numeric:tabular-nums;color:var(--text-muted)}
</style>
</head><body>
<div class="bars">
  <div><div class="b" style="height:4px"></div><div class="l">4</div></div>
  <div><div class="b" style="height:8px"></div><div class="l">8</div></div>
  <div><div class="b" style="height:12px"></div><div class="l">12</div></div>
  <div><div class="b" style="height:16px"></div><div class="l">16</div></div>
  <div><div class="b" style="height:24px"></div><div class="l">24</div></div>
  <div><div class="b" style="height:32px"></div><div class="l">32</div></div>
  <div><div class="b" style="height:40px"></div><div class="l">40</div></div>
  <div><div class="b" style="height:56px"></div><div class="l">56</div></div>
</div>
<div class="r">
  <div class="rr" style="border-radius:var(--radius-xs)">xs 4</div>
  <div class="rr" style="border-radius:var(--radius-sm)">sm 8</div>
  <div class="rr" style="border-radius:var(--radius-md)">md 12</div>
  <div class="rr" style="border-radius:var(--radius-pill)">Pill</div>
  <div style="font-size:12px;color:var(--text-muted)">Controls 36 / 44 / 48 / 56 · nested radii: inner = outer − padding</div>
</div>
</body></html>
